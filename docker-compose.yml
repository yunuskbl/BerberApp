services:

  # ── PostgreSQL Veritabanı ───────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: berberapp-db
    environment:
      POSTGRES_DB: BerberAppDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - berberapp-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── .NET API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: BerberApp.Api/Dockerfile
    container_name: berberapp-api
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      # Veritabanı
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BerberAppDb;Username=postgres;Password=${DB_PASSWORD}

      # JWT
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=ayarliyo.com
      - Jwt__Audience=ayarliyo.com

      # Twilio (WhatsApp)
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__FromNumber=whatsapp:+14155238886
      - Twilio__SmsFromNumber=${TWILIO_SMS_FROM_NUMBER}

      # İleti Merkezi (SMS)
      - IletiMerkezi__ApiKey=${ILETIMERKEZI_API_KEY}
      - IletiMerkezi__Hash=${ILETIMERKEZI_HASH}
      - IletiMerkezi__Sender=${ILETIMERKEZI_SENDER}

      # Email (Gmail SMTP)
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUsername=${EMAIL_SMTP_USERNAME}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD}
      - Email__FromAddress=${EMAIL_SMTP_USERNAME}
      - Email__FromName=ayarlıyo

      # Uygulama URL
      - AppSettings__BaseUrl=${APP_BASE_URL}
      - AppSettings__FrontendBaseUrl=${APP_BASE_URL}

      # SuperAdmin
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}

      - AllowedHosts=*
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - berberapp-network
    restart: always

  # ── Angular Admin Panel ─────────────────────────────────────────────────
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: dockerfile
    container_name: berberapp-admin
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - berberapp-network
    restart: always

  # ── Otomatik Veritabanı Yedekleme ──────────────────────────────────────
  # Her gün saat 03:00'de pg_dump çalıştırır, 7 günden eski yedekleri siler.
  db-backup:
    image: postgres:16
    container_name: berberapp-db-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache dcron > /dev/null 2>&1 || true;
        echo '0 3 * * * PGPASSWORD=$$PGPASSWORD pg_dump -h db -U postgres BerberAppDb --clean --if-exists | gzip > /backups/berberapp_$$(date +%%Y%%m%%d_%%H%%M%%S).sql.gz && find /backups -name \"berberapp_*.sql.gz\" -mtime +7 -delete' | crontab -;
        crond -f -l 8
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - berberapp-network
    restart: always

volumes:
  postgres_data:
  uploads_data:

networks:
  berberapp-network:
    driver: bridge
