services:

  # ── PostgreSQL Veritabanı ───────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: berberapp-db
    environment:
      POSTGRES_DB: BerberAppDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - berberapp-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── .NET API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: BerberApp.Api/Dockerfile
    container_name: berberapp-api
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      # Veritabanı
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BerberAppDb;Username=postgres;Password=${DB_PASSWORD}

      # JWT
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=ayarliyo.com
      - Jwt__Audience=ayarliyo.com

      # SMS sağlayıcı zinciri — sırayla denenir, ilki başarılı olunca durur
      - Sms__Providers=${SMS_PROVIDERS:-Netgsm,Twilio}

      # Twilio (SMS + WhatsApp)
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__FromNumber=whatsapp:+14155238886
      - Twilio__SmsFromNumber=${TWILIO_SMS_FROM_NUMBER}

      # Netgsm (SMS)
      - Netgsm__UserCode=${NETGSM_USERCODE}
      - Netgsm__Password=${NETGSM_PASSWORD}
      - Netgsm__MsgHeader=${NETGSM_MSGHEADER}

      # İyzico Ödeme
      - Iyzico__ApiKey=${IYZICO_API_KEY}
      - Iyzico__SecretKey=${IYZICO_SECRET_KEY}
      - Iyzico__BaseUrl=https://sandbox-api.iyzipay.com
      - Iyzico__CallbackUrl=https://api.ayarliyo.com/api/subscription/callback
      - Iyzico__FrontendSuccessUrl=https://ayarliyo.com/payment/success
      - Iyzico__FrontendFailUrl=https://ayarliyo.com/payment/fail

      # Email (Gmail SMTP)
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUsername=${EMAIL_SMTP_USERNAME}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD}
      - Email__FromAddress=${EMAIL_SMTP_USERNAME}
      - Email__FromName=ayarlıyo
      # Yeni işletme kaydı bildirimleri buraya gider (boşsa SMTP hesabına düşer)
      - Email__AdminNotificationAddress=${ADMIN_NOTIFICATION_EMAIL:-}

      # Uygulama URL
      - AppSettings__BaseUrl=${APP_BASE_URL}
      - AppSettings__FrontendBaseUrl=${APP_BASE_URL}

      # SuperAdmin
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}

      # Docker içinde config dosyası değişikliklerini polling ile izle
      - DOTNET_USE_POLLING_FILE_WATCHER=true

      # WhatsApp — Hibrit: kendi numarasını bağlayan WPPConnect, bağlamayan merkezi Meta
      - WhatsApp__Provider=Hybrid
      - Meta__PhoneNumberId=${META_PHONE_NUMBER_ID:-1192563087266067}
      - Meta__AccessToken=${META_ACCESS_TOKEN}
      - Meta__AppSecret=${META_APP_SECRET}
      - Meta__ApiVersion=v25.0
      - Meta__TemplateLanguage=tr
      - Meta__Templates__RandevuOnay=randevu_onay
      - Meta__Templates__YeniRandevuBildirimi=randevu__onay
      - Meta__Templates__OtpDogrulama=otp_dogrulama
      - Meta__Templates__HizmetTamamlandi=randevu_tamamlandi
      - Meta__Templates__RandevuHatirlatma=randevu_hatirlatma
      - Meta__Templates__RandevuIptal=randevu_iptal

      # WPPConnect (devre dışı — Meta Cloud API kullanılıyor)
      - WppConnect__BaseUrl=http://wppconnect:21465
      - WppConnect__Session=ayarliyo
      - WppConnect__SecretKey=${WPPCONNECT_SECRET_KEY}
      - DOTNET_USE_POLLING_FILE_WATCHER=true

      - AllowedHosts=ayarliyo.com;www.ayarliyo.com;api.ayarliyo.com
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - berberapp-network
    restart: always

  # ── Angular Admin Panel ─────────────────────────────────────────────────
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: dockerfile
    container_name: berberapp-admin
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - berberapp-network
    restart: always

  # ── WPPConnect (WhatsApp Web köprüsü — sadece merkezi OTP gönderimi için) ──
  # NOT: wppconnect-server upstream'i SECRET_KEY env değişkenini okumuyor,
  # her zaman "THISISMYSECURETOKEN" varsayılanını kullanıyor — WPPCONNECT_SECRET_KEY
  # bu yüzden .env'de de "THISISMYSECURETOKEN" olarak ayarlanmalı.
  # Token üretimi ve QR bağlantısı SuperAdmin paneli → WhatsApp sayfasından yapılır
  # (/superadmin/whatsapp) — bu servis dış porta açık değildir, sadece api'nin
  # iç ağdan (http://wppconnect:21465) erişimi vardır.
  wppconnect:
    build:
      context: ./wppconnect
    container_name: berberapp-wppconnect
    environment:
      - SECRET_KEY=${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
    # Güvenlik: bu portu dışarıya açmaya gerek yok — api'ye zaten iç ağdan
    # (http://wppconnect:21465) erişiyor. Dış porta açıksa, gerçek secret'ı
    # bilen (ya da bilmeyen — WPPConnect env SECRET_KEY'i okumuyor, hep
    # THISISMYSECURETOKEN kullanıyor) herkes WhatsApp gateway'ini ele geçirebilirdi.
    volumes:
      - wppconnect_tokens:/usr/src/wppconnect/tokens
    networks:
      - berberapp-network
    restart: always

  # ── Otomatik Veritabanı Yedekleme ──────────────────────────────────────
  # Her gün saat 03:00'de pg_dump çalıştırır, 7 günden eski yedekleri siler.
  db-backup:
    image: postgres:16
    container_name: berberapp-db-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache dcron > /dev/null 2>&1 || true;
        echo '0 3 * * * PGPASSWORD=$$PGPASSWORD pg_dump -h db -U postgres BerberAppDb --clean --if-exists | gzip > /backups/berberapp_$$(date +%%Y%%m%%d_%%H%%M%%S).sql.gz && find /backups -name \"berberapp_*.sql.gz\" -mtime +7 -delete' | crontab -;
        crond -f -l 8
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - berberapp-network
    restart: always

volumes:
  postgres_data:
  uploads_data:
  wppconnect_tokens:

networks:
  berberapp-network:
    driver: bridge
