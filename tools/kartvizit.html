<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ayarlıyo — Kartvizit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e2d8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 48px 24px;
      font-family: 'Inter', sans-serif;
    }

    .cards-wrap { display: flex; flex-direction: column; gap: 28px; align-items: center; }
    .card-row   { display: flex; flex-direction: column; gap: 10px; }

    .card-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      color: rgba(100,85,60,.50);
    }

    /* ─── KART ─── */
    .card {
      width: 856px;
      height: 498px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background: #faf8f4;
      box-shadow:
        0 2px 6px  rgba(160,130,80,.08),
        0 16px 48px rgba(140,110,60,.12),
        inset 0 0 0 1px rgba(201,169,110,.18);
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ─── ÖN YÜZ ─── */
    .front-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 46px 58px;
      display: flex;
      flex-direction: column;
    }

    .logo-mark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 27px;
      color: #1c1814;
      letter-spacing: -0.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }
    .logo-deg {
      font-size: 17px;
      font-weight: 800;
      color: #c9a96e;
      vertical-align: super;
      line-height: 0;
    }
    .logo-sub {
      margin-top: 9px;
      font-family: 'Syne', sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 5.5px;
      color: rgba(140,110,65,.45);
    }

    .spacer { flex: 1; }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .person-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 17.5px;
      color: #1c1814;
      letter-spacing: -.3px;
      -webkit-font-smoothing: antialiased;
    }
    .person-title {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 400;
      color: #8a7d6a;
      letter-spacing: .2px;
    }

    .divider {
      width: 240px;
      height: 1px;
      background: linear-gradient(90deg,
        rgba(201,169,110,.65) 0%,
        rgba(201,169,110,.18) 55%,
        transparent 100%);
      margin: 16px 0 13px;
    }

    .contact-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .contact-line:last-child { margin-bottom: 0; }

    .ci   { font-size: 10.5px; color: #8a7d6a; letter-spacing: .1px; }
    .cdot { width: 3px; height: 3px; border-radius: 50%; background: rgba(201,169,110,.70); flex-shrink: 0; }

    /* qr */
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }
    .qr-wrap {
      padding: 10px;
      background: #f0ece4;
      border-radius: 12px;
      border: 1px solid rgba(201,169,110,.22);
    }
    .qr-wrap img { display: block; border-radius: 6px; }
    .qr-lbl {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: rgba(140,110,65,.45);
    }

    /* ─── ARKA YÜZ ─── */
    .back-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 76px;
      color: #1c1814;
      letter-spacing: -2.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }
    .back-deg {
      font-size: 46px;
      font-weight: 800;
      color: #c9a96e;
      vertical-align: super;
      line-height: 0;
    }

    .back-divider {
      width: 220px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(201,169,110,.55),
        transparent);
      margin: 22px 0 19px;
    }

    .back-sub {
      font-family: 'Syne', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 8px;
      color: rgba(140,110,65,.40);
    }

    /* ─── AKSIYONLAR ─── */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-primary { background: #b8954a; color: #fff; }
    .btn-ghost {
      background: rgba(180,145,70,.10);
      color: #8a6c2a;
      border: 1px solid rgba(180,145,70,.25);
    }

    @media print {
      body { background: #fff; padding: 0; gap: 0; }
      .actions { display: none; }
      .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="cards-wrap">

  <!-- ÖN YÜZ -->
  <div class="card-row">
    <div class="card-label">ÖN YÜZ</div>
    <div class="card" id="card-front">

      <!-- Sol üst sıcak glow -->
      <div class="glow" style="
        top:-160px; left:-120px;
        width:520px; height:520px;
        background: radial-gradient(circle,
          rgba(220,190,130,.14) 0%,
          rgba(220,190,130,.05) 45%,
          transparent 70%);
      "></div>

      <!-- Sağ alt hafif sıcak glow -->
      <div class="glow" style="
        bottom:-150px; right:-90px;
        width:380px; height:380px;
        background: radial-gradient(circle,
          rgba(220,190,130,.08) 0%,
          transparent 65%);
      "></div>

      <div class="front-inner">

        <div>
          <div class="logo-mark">ayarlıyo<span class="logo-deg">°</span></div>
          <div class="logo-sub">RANDEVU SISTEMI</div>
        </div>

        <div class="spacer"></div>

        <div class="bottom-row">
          <div>
            <div class="person-name">Yunus Emre Kobal</div>
            <div class="person-title">Kurucu &amp; Geliştirici</div>
            <div class="divider"></div>
            <div class="contact-line">
              <span class="ci">+90 538 399 69 16</span>
              <span class="cdot"></span>
              <span class="ci">ayarliyoinfo@gmail.com</span>
            </div>
            <div class="contact-line">
              <span class="ci">@ayarlıyo</span>
              <span class="cdot"></span>
              <span class="ci">ayarliyo.com</span>
            </div>
          </div>

          <div class="qr-block">
            <div class="qr-wrap">
              <img id="qr-img" width="80" height="80" alt="QR">
            </div>
            <div class="qr-lbl">AYARLIYO.COM</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ARKA YÜZ -->
  <div class="card-row">
    <div class="card-label">ARKA YÜZ</div>
    <div class="card" id="card-back">

      <div class="glow" style="
        top:50%; left:50%;
        transform: translate(-50%,-55%);
        width:620px; height:620px;
        background: radial-gradient(circle,
          rgba(220,190,130,.15) 0%,
          rgba(220,190,130,.06) 42%,
          transparent 68%);
      "></div>

      <div class="back-inner">
        <div class="back-logo">ayarlıyo<span class="back-deg">°</span></div>
        <div class="back-divider"></div>
        <div class="back-sub">RANDEVU SISTEMI</div>
      </div>

    </div>
  </div>

</div>

<div class="actions">
  <button class="btn btn-primary" onclick="dl('card-front','ayarliyo-on-yuz.png')">⬇ Ön Yüz PNG</button>
  <button class="btn btn-primary" onclick="dl('card-back','ayarliyo-arka-yuz.png')">⬇ Arka Yüz PNG</button>
  <button class="btn btn-ghost" onclick="window.print()">🖨 Yazdır</button>
</div>

<script>
  // QR — img tag kullanıyoruz, html2canvas canvas yakalayamıyor
  QRCode.toDataURL('https://ayarliyo.com', {
    width: 80,
    margin: 0,
    color: { dark: '#2d2010', light: '#f0ece4' }
  }, function(err, url) {
    if (!err) document.getElementById('qr-img').src = url;
  });

  async function dl(id, name) {
    const el = document.getElementById(id);
    const c  = await html2canvas(el, {
      scale: 3,
      backgroundColor: null,
      useCORS: true,
      logging: false,
      allowTaint: true
    });
    const a = document.createElement('a');
    a.download = name;
    a.href = c.toDataURL('image/png');
    a.click();
  }
</script>

</body>
</html>
