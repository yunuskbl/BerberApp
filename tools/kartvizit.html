<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ayarlıyo — Kartvizit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1025;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 48px 24px;
      font-family: 'Inter', sans-serif;
    }

    .cards-wrap {
      display: flex;
      flex-direction: column;
      gap: 28px;
      align-items: center;
    }

    .card-row { display: flex; flex-direction: column; gap: 10px; }

    .card-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      color: rgba(196,181,253,.35);
    }

    /* ─── KART TEMEL ─── */
    .card {
      width: 856px;
      height: 498px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      /* Derin mor-siyah zemin */
      background: radial-gradient(ellipse at 22% 18%, #1e0a42 0%, #100620 55%, #060210 100%);
      /* İnce mor kenarlık */
      box-shadow: inset 0 0 0 1px rgba(124,58,237,.20);
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ─── ÖN YÜZ ─── */
    .front-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 46px 58px;
      display: flex;
      flex-direction: column;
    }

    /* logo */
    .logo-mark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 27px;
      color: #fff;
      letter-spacing: -0.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }
    .logo-deg {
      font-size: 17px;
      font-weight: 800;
      color: #a78bfa;
      vertical-align: super;
      line-height: 0;
    }
    .logo-sub {
      margin-top: 9px;
      font-family: 'Syne', sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 5.5px;
      color: rgba(167,139,250,.40);
    }

    .spacer { flex: 1; }

    /* alt alan */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .person-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 17.5px;
      color: #fff;
      letter-spacing: -.3px;
      -webkit-font-smoothing: antialiased;
    }
    .person-title {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 400;
      color: rgba(196,181,253,.50);
      letter-spacing: .2px;
    }

    /* gradient çizgi: mordan şeffafa */
    .divider {
      width: 240px;
      height: 1px;
      background: linear-gradient(90deg, rgba(124,58,237,.60) 0%, rgba(124,58,237,.15) 55%, transparent 100%);
      margin: 16px 0 13px;
    }

    .contact-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .contact-line:last-child { margin-bottom: 0; }

    .ci {
      font-size: 10.5px;
      color: rgba(196,181,253,.42);
      letter-spacing: .1px;
    }
    .cdot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(124,58,237,.55);
      flex-shrink: 0;
    }

    /* qr */
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }
    .qr-block canvas { border-radius: 10px; display: block; }
    .qr-lbl {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: rgba(167,139,250,.28);
    }

    /* ─── ARKA YÜZ ─── */
    .back-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 76px;
      color: #fff;
      letter-spacing: -2.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }
    .back-deg {
      font-size: 46px;
      font-weight: 800;
      color: #a78bfa;
      vertical-align: super;
      line-height: 0;
    }

    .back-divider {
      width: 220px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.50), transparent);
      margin: 22px 0 19px;
    }

    .back-sub {
      font-family: 'Syne', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 8px;
      color: rgba(167,139,250,.30);
    }

    /* ─── AKSIYONLAR ─── */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-ghost {
      background: rgba(124,58,237,.12);
      color: rgba(196,181,253,.80);
      border: 1px solid rgba(124,58,237,.25);
    }

    @media print {
      body { background: #fff; padding: 0; gap: 0; }
      .actions { display: none; }
      .card-label { color: #555; }
      .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="cards-wrap">

  <!-- ÖN YÜZ -->
  <div class="card-row">
    <div class="card-label">ÖN YÜZ</div>
    <div class="card" id="card-front">

      <!-- Mor speküler glow sol üst -->
      <div class="glow" style="
        top:-140px; left:-100px;
        width:540px; height:540px;
        background: radial-gradient(circle,
          rgba(124,58,237,.22) 0%,
          rgba(109,40,217,.08) 42%,
          transparent 70%);
      "></div>

      <!-- Sağ alt hafif rim -->
      <div class="glow" style="
        bottom:-160px; right:-80px;
        width:400px; height:400px;
        background: radial-gradient(circle,
          rgba(124,58,237,.08) 0%,
          transparent 65%);
      "></div>

      <div class="front-inner">

        <div>
          <div class="logo-mark">ayarlıyo<span class="logo-deg">°</span></div>
          <div class="logo-sub">RANDEVU SISTEMI</div>
        </div>

        <div class="spacer"></div>

        <div class="bottom-row">
          <div>
            <div class="person-name">Yunus Emre Kobal</div>
            <div class="person-title">Kurucu &amp; Geliştirici</div>
            <div class="divider"></div>
            <div class="contact-line">
              <span class="ci">+90 538 399 69 16</span>
              <span class="cdot"></span>
              <span class="ci">ayarliyoinfo@gmail.com</span>
            </div>
            <div class="contact-line">
              <span class="ci">@ayarlıyo</span>
              <span class="cdot"></span>
              <span class="ci">ayarliyo.com</span>
            </div>
          </div>

          <div class="qr-block">
            <canvas id="qr"></canvas>
            <div class="qr-lbl">AYARLIYO.COM</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ARKA YÜZ -->
  <div class="card-row">
    <div class="card-label">ARKA YÜZ</div>
    <div class="card" id="card-back">

      <!-- Büyük merkezi mor glow -->
      <div class="glow" style="
        top:50%; left:50%;
        transform: translate(-50%,-56%);
        width:660px; height:660px;
        background: radial-gradient(circle,
          rgba(124,58,237,.26) 0%,
          rgba(109,40,217,.10) 38%,
          transparent 68%);
      "></div>

      <!-- Alt hafif aksent -->
      <div class="glow" style="
        bottom:-120px; left:50%;
        transform: translateX(-50%);
        width:400px; height:300px;
        background: radial-gradient(circle,
          rgba(124,58,237,.08) 0%,
          transparent 70%);
      "></div>

      <div class="back-inner">
        <div class="back-logo">ayarlıyo<span class="back-deg">°</span></div>
        <div class="back-divider"></div>
        <div class="back-sub">RANDEVU SISTEMI</div>
      </div>

    </div>
  </div>

</div>

<div class="actions">
  <button class="btn btn-primary" onclick="dl('card-front','ayarliyo-on-yuz.png')">⬇ Ön Yüz PNG</button>
  <button class="btn btn-primary" onclick="dl('card-back','ayarliyo-arka-yuz.png')">⬇ Arka Yüz PNG</button>
  <button class="btn btn-ghost" onclick="window.print()">🖨 Yazdır</button>
</div>

<script>
  // QR — mor renkli
  QRCode.toCanvas(document.getElementById('qr'), 'https://ayarliyo.com', {
    width: 88,
    margin: 1,
    color: { dark: '#a78bfa', light: '#00000000' }
  });

  async function dl(id, name) {
    const el = document.getElementById(id);
    const c  = await html2canvas(el, {
      scale: 3,
      backgroundColor: null,
      useCORS: true,
      logging: false
    });
    const a = document.createElement('a');
    a.download = name;
    a.href = c.toDataURL('image/png');
    a.click();
  }
</script>

</body>
</html>
