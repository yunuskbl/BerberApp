<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ayarlıyo — Kartvizit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #c8c3bb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 56px 24px;
      font-family: 'Inter', sans-serif;
    }

    .cards-wrap { display: flex; flex-direction: column; gap: 32px; align-items: center; }
    .card-row   { display: flex; flex-direction: column; gap: 10px; }
    .card-label {
      font-size: 10px; font-weight: 500; letter-spacing: 3px;
      color: rgba(50,45,38,.50);
    }

    /* ═══════════════════════════════
       ÖN YÜZ  —  krem  #ede8e0
    ═══════════════════════════════ */
    .front {
      width: 856px;
      height: 498px;
      border-radius: 16px;
      overflow: hidden;
      background: #ede8e0;
      position: relative;
      box-shadow:
        0 2px 8px  rgba(30,25,20,.10),
        0 24px 60px rgba(30,25,20,.18);
      display: flex;
      flex-direction: column;
    }

    /* Çok hafif noise dokusu (SVG filter) */
    .front::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* üst alan */
    .f-top {
      flex: 1;
      padding: 42px 52px 0;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    .logo-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo-mark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 29px;
      color: #111;
      letter-spacing: -0.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }
    .logo-deg {
      font-size: 18px; font-weight: 800;
      color: #666; vertical-align: super; line-height: 0;
    }
    .logo-sub {
      margin-top: 9px;
      font-family: 'Syne', sans-serif;
      font-size: 8px; font-weight: 600;
      letter-spacing: 5.5px;
      color: rgba(30,25,20,.35);
    }

    /* sağ üst köşe dekoratif element */
    .corner-mark {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(30,25,20,.12);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .corner-mark span {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 800;
      color: rgba(30,25,20,.18);
      line-height: 1;
    }

    .f-spacer { flex: 1; }

    /* tam genişlik ince ayraç */
    .f-rule {
      height: 1px;
      background: rgba(30,25,20,.10);
      margin: 0 52px;
      position: relative;
      z-index: 1;
    }

    /* alt alan */
    .f-bottom {
      padding: 22px 52px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }

    .person-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #111;
      letter-spacing: -.4px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.1;
    }
    .person-title {
      margin-top: 5px;
      font-size: 11px; font-weight: 500;
      color: rgba(30,25,20,.45);
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    /* iletişim grid */
    .contact-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 7px 28px;
      align-items: center;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .c-icon {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(30,25,20,.18);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .c-icon svg { width: 7px; height: 7px; }
    .c-text {
      font-size: 10.5px; font-weight: 400;
      color: rgba(30,25,20,.55);
      letter-spacing: .05px;
    }

    /* QR */
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .qr-frame {
      width: 88px; height: 88px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid rgba(30,25,20,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(30,25,20,.06);
    }
    .qr-frame img { width: 72px; height: 72px; display: block; }
    .qr-lbl {
      font-size: 8px; font-weight: 500;
      letter-spacing: 2px;
      color: rgba(30,25,20,.30);
    }

    /* ═══════════════════════════════
       ARKA YÜZ  —  siyah  #0e0e0e
    ═══════════════════════════════ */
    .back {
      width: 856px;
      height: 498px;
      border-radius: 16px;
      overflow: hidden;
      background: #0e0e0e;
      position: relative;
      box-shadow:
        0 2px 8px  rgba(0,0,0,.25),
        0 24px 60px rgba(0,0,0,.40);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Çok hafif krem glow merkezi */
    .back::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-56%);
      width: 560px; height: 560px;
      background: radial-gradient(circle,
        rgba(237,232,224,.09) 0%,
        rgba(237,232,224,.03) 42%,
        transparent 68%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* sağ alt köşe ince daire */
    .back::after {
      content: '';
      position: absolute;
      bottom: 32px; right: 44px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(237,232,224,.10);
    }

    .back-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 82px;
      color: #ede8e0;
      letter-spacing: -2.5px;
      -webkit-font-smoothing: antialiased;
      line-height: 1;
      position: relative; z-index: 1;
    }
    .back-deg {
      font-size: 50px; font-weight: 800;
      color: rgba(237,232,224,.50);
      vertical-align: super; line-height: 0;
    }
    .back-rule {
      width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237,232,224,.22), transparent);
      margin: 22px 0 18px;
      position: relative; z-index: 1;
    }
    .back-sub {
      font-family: 'Syne', sans-serif;
      font-size: 10px; font-weight: 600;
      letter-spacing: 8px;
      color: rgba(237,232,224,.22);
      position: relative; z-index: 1;
    }

    /* ─── AKSIYONLAR ─── */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 12px 28px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-dark  { background: #111; color: #ede8e0; }
    .btn-ghost {
      background: rgba(30,25,20,.07);
      color: rgba(30,25,20,.65);
      border: 1px solid rgba(30,25,20,.15);
    }
    @media print {
      body { background: #fff; padding: 0; }
      .actions, .card-label { display: none; }
      .front, .back { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="cards-wrap">

  <!-- ÖN YÜZ -->
  <div class="card-row">
    <div class="card-label">ÖN YÜZ</div>
    <div class="front" id="card-front">
      <div class="f-top">
        <div class="logo-row">
          <div>
            <div class="logo-mark">ayarlıyo<span class="logo-deg">°</span></div>
            <div class="logo-sub">RANDEVU SISTEMI</div>
          </div>
          <div class="corner-mark"><span>°</span></div>
        </div>
        <div class="f-spacer"></div>
      </div>

      <div class="f-rule"></div>

      <div class="f-bottom">
        <div>
          <div class="person-name">Yunus Emre Kobal</div>
          <div class="person-title">Kurucu &amp; Geliştirici</div>

          <div class="contact-grid">
            <!-- telefon -->
            <div class="contact-item">
              <div class="c-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 1.5C2 1.5 2.5 3 3.5 4S6.5 6 6.5 6L7.5 5C7.5 5 8 5.5 8.5 6L7 8C7 8 4 7.5 2 5.5S1 2 1 2L2 1.5Z" stroke="rgba(30,25,20,.45)" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <span class="c-text">+90 538 399 69 16</span>
            </div>
            <!-- email -->
            <div class="contact-item">
              <div class="c-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="1" y="2.5" width="8" height="5.5" rx="1" stroke="rgba(30,25,20,.45)" stroke-width=".9"/>
                  <path d="M1.5 3L5 6L8.5 3" stroke="rgba(30,25,20,.45)" stroke-width=".9" stroke-linecap="round"/>
                </svg>
              </div>
              <span class="c-text">ayarliyoinfo@gmail.com</span>
            </div>
            <!-- instagram -->
            <div class="contact-item">
              <div class="c-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="1.5" y="1.5" width="7" height="7" rx="2" stroke="rgba(30,25,20,.45)" stroke-width=".9"/>
                  <circle cx="5" cy="5" r="1.5" stroke="rgba(30,25,20,.45)" stroke-width=".9"/>
                  <circle cx="7.2" cy="2.8" r=".4" fill="rgba(30,25,20,.45)"/>
                </svg>
              </div>
              <span class="c-text">@ayarlıyo</span>
            </div>
            <!-- website -->
            <div class="contact-item">
              <div class="c-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="5" cy="5" r="3.5" stroke="rgba(30,25,20,.45)" stroke-width=".9"/>
                  <path d="M5 1.5C5 1.5 6.5 3 6.5 5S5 8.5 5 8.5M5 1.5C5 1.5 3.5 3 3.5 5S5 8.5 5 8.5M1.5 5H8.5" stroke="rgba(30,25,20,.45)" stroke-width=".9" stroke-linecap="round"/>
                </svg>
              </div>
              <span class="c-text">ayarliyo.com</span>
            </div>
          </div>
        </div>

        <div class="qr-block">
          <div class="qr-frame">
            <img id="qr-img" alt="QR">
          </div>
          <div class="qr-lbl">AYARLIYO.COM</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ARKA YÜZ -->
  <div class="card-row">
    <div class="card-label">ARKA YÜZ</div>
    <div class="back" id="card-back">
      <div class="back-logo">ayarlıyo<span class="back-deg">°</span></div>
      <div class="back-rule"></div>
      <div class="back-sub">RANDEVU SISTEMI</div>
    </div>
  </div>

</div>

<div class="actions">
  <button class="btn btn-dark"  onclick="dl('card-front','ayarliyo-on-yuz.png')">⬇ Ön Yüz PNG</button>
  <button class="btn btn-dark"  onclick="dl('card-back', 'ayarliyo-arka-yuz.png')">⬇ Arka Yüz PNG</button>
  <button class="btn btn-ghost" onclick="window.print()">🖨 Yazdır</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  /* QR: api.qrserver.com → canvas → data URL → img */
  (function() {
    var src =
      'https://api.qrserver.com/v1/create-qr-code/' +
      '?size=144x144&bgcolor=ffffff&color=111111&qzone=1' +
      '&data=https%3A%2F%2Fayarliyo.com';

    var loader = new Image();
    loader.crossOrigin = 'anonymous';

    loader.onload = function() {
      try {
        var c = document.createElement('canvas');
        c.width = c.height = 72;
        c.getContext('2d').drawImage(loader, 0, 0, 72, 72);
        document.getElementById('qr-img').src = c.toDataURL('image/png');
      } catch(e) {
        document.getElementById('qr-img').src = src;
      }
    };
    loader.onerror = function() {
      document.querySelector('.qr-frame').innerHTML =
        '<div style="font-size:9px;color:#666;text-align:center;padding:10px;line-height:1.6">' +
        'ayarliyo<br>.com</div>';
    };
    loader.src = src;
  })();

  async function dl(id, name) {
    var el = document.getElementById(id);
    var c  = await html2canvas(el, {
      scale: 3, backgroundColor: null, useCORS: true, logging: false
    });
    var a = document.createElement('a');
    a.download = name;
    a.href = c.toDataURL('image/png');
    a.click();
  }
</script>

</body>
</html>
