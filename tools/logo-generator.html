<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ayarlıyo — Logo Üretici</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #3a3a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 28px;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      width: 400px;
      height: 400px;
    }
    .btn {
      padding: 13px 32px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -.2px;
    }
    .btn:hover { background: #6d28d9; }
    .note { color: rgba(255,255,255,0.5); font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="c" width="1000" height="1000"></canvas>
  <button class="btn" onclick="dl()">⬇ PNG indir (1000 × 1000)</button>
  <p class="note">Syne 800 · profil fotoğrafı için hazır</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const S = 1000, cx = S / 2, cy = S / 2, R = S / 2;

    function draw() {
      ctx.clearRect(0, 0, S, S);

      /* ── daire klibi ── */
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.clip();

      /* ── derin siyah zemin ── */
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      bg.addColorStop(0,   '#181818');
      bg.addColorStop(0.6, '#0a0a0a');
      bg.addColorStop(1,   '#010101');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, S, S);

      /* ── küre speküler highlight (sol üst) ── */
      const spec = ctx.createRadialGradient(cx * 0.62, cy * 0.38, 0, cx * 0.62, cy * 0.38, R * 0.52);
      spec.addColorStop(0,    'rgba(255,255,255,0.20)');
      spec.addColorStop(0.35, 'rgba(255,255,255,0.08)');
      spec.addColorStop(0.7,  'rgba(255,255,255,0.02)');
      spec.addColorStop(1,    'rgba(255,255,255,0)');
      ctx.fillStyle = spec;
      ctx.fillRect(0, 0, S, S);

      /* ── alt kenar hafif rim ışığı ── */
      const rim = ctx.createRadialGradient(cx, R * 1.82, 0, cx, R * 1.82, R * 0.75);
      rim.addColorStop(0,   'rgba(255,255,255,0.07)');
      rim.addColorStop(0.5, 'rgba(255,255,255,0.02)');
      rim.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = rim;
      ctx.fillRect(0, 0, S, S);

      ctx.restore();

      /* ── metin ── */
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.clip();

      const mainSize   = 108;
      const suffixSize = 68;   /* ° daha küçük */
      const textY      = cy + 18;

      /* ana metin ölçümü */
      ctx.font = `800 ${mainSize}px Syne`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '-3px';
      const mainW = ctx.measureText('ayarlıyo').width;

      /* suffix ölçümü */
      ctx.font = `800 ${suffixSize}px Syne`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      const sufW = ctx.measureText('°').width;

      const groupW = mainW + sufW;
      const startX = cx - groupW / 2;

      /* ayarlıyo */
      ctx.font = `800 ${mainSize}px Syne`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '-3px';
      ctx.fillStyle    = '#ffffff';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign    = 'left';
      ctx.fillText('ayarlıyo', startX, textY);

      /* ° — küçük, hafif yukarıda, %70 opaklık */
      ctx.font = `800 ${suffixSize}px Syne`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.fillStyle = 'rgba(255,255,255,0.70)';
      ctx.fillText('°', startX + mainW, textY - 28);

      /* randevu sistemi — altında, silik */
      const tagSize = 30;
      ctx.font = `600 ${tagSize}px Syne`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '6px';
      ctx.fillStyle    = 'rgba(255,255,255,0.30)';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('randevu sistemi', cx, textY + 58);

      ctx.restore();
    }

    document.fonts.load('800 48px Syne', 'ayarlıyo randevu sistemi°ıöüşğç').then(draw).catch(draw);

    function dl() {
      const a = document.createElement('a');
      a.download = 'ayarliyo-logo.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
