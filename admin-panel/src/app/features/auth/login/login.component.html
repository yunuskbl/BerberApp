<div class="login-wrapper">

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <app-logo variant="light"></app-logo>
    </div>

    <p class="subtitle">Admin Paneline Giriş Yapın</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label>EMAİL</label>
        <input
          type="email"
          formControlName="email"
          placeholder="admin@ayarliyo.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"/>
        <span class="error-text"
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Geçerli bir email giriniz.
        </span>
      </div>

      <div class="field">
        <label>ŞİFRE</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"/>
        <span class="error-text"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Şifre zorunludur.
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="forgot-link">
        <a routerLink="/forgot-password">Şifremi Unuttum</a>
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-login">
        <span *ngIf="!isLoading">Giriş Yap</span>
        <span *ngIf="isLoading" class="loading">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </button>

    </form>

    <p class="footer-text">ayarlıyo © 2026 — Tüm hakları saklıdır.</p>

  </div>
</div>
